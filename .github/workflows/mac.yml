# 맥판 자동 빌드 — 맥이 없어도 GitHub의 맥 서버에서 빌드됨
#  - 코드를 올리면(push) 자동 실행 / Actions 탭에서 [Run workflow]로 직접 실행도 가능
#  - 결과물: 실행 기록 페이지 아래 Artifacts의 DeskPet-mac
#  - v로 시작하는 태그(예: v1.0.0)를 올리면 같은 이름의 릴리즈에 zip이 자동으로 붙음
name: macOS build

on:
  workflow_dispatch:
  push:
    branches: [main]
    tags: ['v*']
    paths:
      - 'DeskPetMac/**'
      - 'DeskPetShell/web/**'
      - '.github/workflows/mac.yml'

permissions:
  contents: write

jobs:
  build:
    runs-on: macos-14
    steps:
      - uses: actions/checkout@v4

      - name: Build DeskPet.app
        run: bash DeskPetMac/build_app.sh

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: DeskPet-mac
          path: DeskPetMac/dist/*.zip

      - name: Attach to release (태그일 때만)
        if: startsWith(github.ref, 'refs/tags/v')
        uses: softprops/action-gh-release@v2
        with:
          files: DeskPetMac/dist/*.zip
